<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Symbol Web - Result</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🎨 Symbol Web</h1>
    </header>

    <section class="result">
      <h2>Result for "{{.Text}}" ({{.SelectedBanner}})</h2>
      <pre class="ascii-output">{{.Result}}</pre>
    </section>

    <a class="btn-secondary" href="/">&larr; Back to generator</a>
  </div>
</body>
</html>
